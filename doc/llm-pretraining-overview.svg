<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
<title id="title">LLM pretraining: macroscopic laws, microscopic mechanisms, and training principles</title>
<desc id="desc">Macroscopic laws constrain models of microscopic mechanisms; these mechanisms explain the laws and inform training principles. Training guided by these principles tests and refines the laws. Central next-token probabilities and scaling-law fit and validation points are schematic, not empirical data.</desc>
